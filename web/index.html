<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>remotion-agent-catalog</title>
  <style>
    :root {
      --bg: #0b0d12; --panel: #12151d; --panel-2: #171b25; --border: #232838;
      --text: #e7ebf3; --muted: #93a0b8; --faint: #63708c;
      --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      --RemotionUI: #4b8bff; --Autoral: #37d399; --Bits: #b184ff; --Remocn: #ffb020;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
    }
    header {
      position: sticky; top: 0; z-index: 5; background: rgba(11,13,18,.85);
      backdrop-filter: blur(10px); border-bottom: 1px solid var(--border);
      padding: 18px 24px;
    }
    .wrap { max-width: 1100px; margin: 0 auto; }
    h1 { font-size: 18px; margin: 0; letter-spacing: .2px; }
    h1 span { color: var(--faint); font-weight: 500; }
    .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
    .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 14px; }
    #q {
      flex: 1 1 320px; min-width: 220px; background: var(--panel-2); border: 1px solid var(--border);
      color: var(--text); border-radius: 10px; padding: 10px 14px; font-size: 15px; outline: none;
    }
    #q:focus { border-color: var(--RemotionUI); }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip, .tab {
      background: var(--panel-2); border: 1px solid var(--border); color: var(--muted);
      border-radius: 999px; padding: 7px 13px; font-size: 13px; cursor: pointer; user-select: none;
    }
    .chip.active { color: var(--text); border-color: var(--faint); background: var(--panel); }
    .chip .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
    .chip .n { color: var(--faint); margin-left: 5px; }
    .tabs { display: flex; gap: 6px; margin-top: 12px; }
    .tab.active { color: var(--text); background: var(--panel); border-color: var(--faint); }
    main { max-width: 1100px; margin: 22px auto 60px; padding: 0 24px; }
    .count { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
    .card {
      background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .card .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .name { font-weight: 650; font-size: 15px; }
    .badge { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 6px; white-space: nowrap; }
    .quando { color: var(--muted); font-size: 13.5px; }
    .imp {
      display: flex; align-items: center; gap: 8px; background: var(--panel-2); border: 1px solid var(--border);
      border-radius: 8px; padding: 7px 10px; font-family: var(--mono); font-size: 12.5px; color: var(--text);
    }
    .imp code { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .imp button {
      background: transparent; border: 1px solid var(--border); color: var(--muted); border-radius: 6px;
      padding: 3px 8px; font-size: 11px; cursor: pointer;
    }
    .imp button:hover { color: var(--text); border-color: var(--faint); }
    .meta { color: var(--faint); font-size: 12px; display: flex; gap: 10px; flex-wrap: wrap; }
    .empty { color: var(--muted); padding: 40px 0; text-align: center; }
    /* receitas */
    .recipe { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
    .recipe .top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
    .recipe .tracks { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .track { font-family: var(--mono); font-size: 12px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px; color: var(--muted); }
    .stub { color: var(--Remocn); }
    a { color: var(--RemotionUI); }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>remotion-agent-catalog <span id="stat-head"></span></h1>
      <div class="sub">Busca por intenção — descreva o que você quer e receba a peça, a lib e o caminho de import.</div>
      <div class="tabs">
        <div class="tab active" data-tab="pecas">Peças</div>
        <div class="tab" data-tab="receitas">Receitas</div>
      </div>
      <div class="controls" id="pecas-controls">
        <input id="q" type="search" placeholder="ex.: transição, barras, gancho, brilho…" autocomplete="off" />
        <div class="chips" id="chips"></div>
      </div>
    </div>
  </header>
  <main>
    <div class="count" id="count"></div>
    <div class="grid" id="grid"></div>
    <div id="receitas" style="display:none"></div>
  </main>

  <script>
    const LIB_ORDER = ["RemotionUI", "Autoral", "Bits", "Remocn"];
    const state = { q: "", lib: null, tab: "pecas", pieces: [], cat: null };

    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const norm = (s) => String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

    function getPieces(cat) {
      const out = [];
      for (const p of cat.paginas ?? [])
        for (const it of p.itens ?? []) out.push({ ...it, origem: `página · ${p.titulo}` });
      for (const v of cat.verticais ?? []) out.push({ ...v, origem: "vertical" });
      return out;
    }

    function renderChips() {
      const byLib = Object.fromEntries(LIB_ORDER.map((l) => [l, 0]));
      for (const p of state.pieces) byLib[p.lib] = (byLib[p.lib] ?? 0) + 1;
      const chips = document.getElementById("chips");
      const mk = (lib, label, count) =>
        `<div class="chip ${state.lib === lib ? "active" : ""}" data-lib="${lib ?? ""}">` +
        (lib ? `<span class="dot" style="background:var(--${lib})"></span>` : "") +
        `${label}<span class="n">${count}</span></div>`;
      chips.innerHTML =
        mk(null, "Todas", state.pieces.length) +
        LIB_ORDER.map((l) => mk(l, l, byLib[l])).join("");
      chips.querySelectorAll(".chip").forEach((el) =>
        el.addEventListener("click", () => {
          const lib = el.dataset.lib || null;
          state.lib = state.lib === lib ? null : lib;
          renderChips(); renderGrid();
        }));
    }

    function match(p) {
      if (state.lib && p.lib !== state.lib) return false;
      if (!state.q) return true;
      const q = norm(state.q);
      return [p.nome, p.quando, p.importa].some((f) => norm(f ?? "").includes(q));
    }

    function card(p) {
      const dur = p.ciclo ? `ciclo ${p.ciclo}f` : p.duracao ? `duração ${p.duracao}f` : "";
      return `<div class="card">
        <div class="top">
          <span class="name">${esc(p.nome)}</span>
          <span class="badge" style="background:color-mix(in srgb, var(--${p.lib}) 18%, transparent); color:var(--${p.lib})">${p.lib}</span>
        </div>
        <div class="quando">${esc(p.quando ?? "")}</div>
        <div class="imp"><code title="${esc(p.importa)}">${esc(p.importa)}</code><button data-copy="${esc(p.importa)}">copiar</button></div>
        <div class="meta"><span>${esc(p.origem)}</span>${dur ? `<span>${dur}</span>` : ""}${p.cena ? "<span>cena</span>" : ""}</div>
      </div>`;
    }

    function renderGrid() {
      const list = state.pieces.filter(match);
      document.getElementById("count").textContent =
        `${list.length} peça(s)` + (state.lib ? ` · ${state.lib}` : "") + (state.q ? ` · "${state.q}"` : "");
      const grid = document.getElementById("grid");
      grid.innerHTML = list.length ? list.map(card).join("") : "";
      document.querySelector(".empty")?.remove();
      if (!list.length) grid.insertAdjacentHTML("afterend", `<div class="empty">Nenhuma peça casa esse filtro.</div>`);
      grid.querySelectorAll("button[data-copy]").forEach((b) =>
        b.addEventListener("click", async () => {
          try { await navigator.clipboard.writeText(b.dataset.copy); const t = b.textContent; b.textContent = "copiado!"; setTimeout(() => (b.textContent = t), 1200); }
          catch { b.textContent = "erro"; }
        }));
    }

    function renderReceitas() {
      const box = document.getElementById("receitas");
      box.innerHTML = (state.cat.receitas ?? []).map((r) => `
        <div class="recipe">
          <div class="top">
            <strong>${esc(r.titulo)}</strong>
            <span class="meta">${esc(r.formato)} · ${r.duracao}f · ${r.trilhas ? "completa" : `<span class="stub">stub</span>`}</span>
          </div>
          ${r.resumo ? `<div class="quando">${esc(r.resumo)}</div>` : ""}
          ${r.trilhas ? `<div class="tracks">${r.trilhas.map((t) => `<span class="track">${esc(t.nome)} · ${t.from}→${t.from + t.dur}</span>`).join("")}</div>` : ""}
        </div>`).join("");
    }

    function switchTab(tab) {
      state.tab = tab;
      document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("active", t.dataset.tab === tab));
      const isPecas = tab === "pecas";
      document.getElementById("pecas-controls").style.display = isPecas ? "flex" : "none";
      document.getElementById("grid").style.display = isPecas ? "grid" : "none";
      document.getElementById("count").style.display = isPecas ? "block" : "none";
      document.querySelector(".empty")?.remove();
      document.getElementById("receitas").style.display = isPecas ? "none" : "block";
      if (!isPecas) renderReceitas();
    }

    async function main() {
      const cat = await fetch("/catalog.json").then((r) => r.json());
      state.cat = cat;
      state.pieces = getPieces(cat);
      const unique = new Set(state.pieces.map((p) => p.nome)).size;
      document.getElementById("stat-head").textContent =
        `· ${unique} peças únicas · ${state.pieces.length} entradas · ${cat.receitas?.length ?? 0} receitas`;
      renderChips(); renderGrid();
      document.getElementById("q").addEventListener("input", (e) => { state.q = e.target.value.trim(); renderGrid(); });
      document.querySelectorAll(".tab").forEach((t) => t.addEventListener("click", () => switchTab(t.dataset.tab)));
    }
    main().catch((e) => { document.getElementById("grid").innerHTML = `<div class="empty">Falhou ao carregar catalog.json: ${esc(e.message)}</div>`; });
  </script>
</body>
</html>
