name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validar catalog.json (schema + invariantes + contagens do README)
        run: npm run validate
      - name: Typecheck (Studio / src)
        run: npm run typecheck
      - name: Testes (lib, validador, CLI, MCP)
        run: npm test
      - name: Smoke test do CLI
        run: |
          node bin/catalog.mjs stats
          node bin/catalog.mjs find "transição" --json > /dev/null
